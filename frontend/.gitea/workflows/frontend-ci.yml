name: Frontend CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: frontend
  IMAGE_VERSION: "1.0.${{ github.run_number }}"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Login to Container Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login "${{ secrets.REGISTRY_HOST }}" \
            --username "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" \
            --tag "${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}/${IMAGE_NAME}:${IMAGE_VERSION}" \
            --tag "${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}/${IMAGE_NAME}:sha-${{ steps.meta.outputs.sha_short }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}/${IMAGE_NAME}:${IMAGE_VERSION}"
          docker push "${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}/${IMAGE_NAME}:sha-${{ steps.meta.outputs.sha_short }}"

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency: manifests-frontend     # два запуска не будут пушить одновременно

    steps:
      - name: Bump frontend image tag
        env:
          TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
          REPO: 192.168.1.205:3000/user1/cluster-platform-repo.git
        run: |
          git clone "http://user1:${TOKEN}@${REPO}" manifests
          cd manifests

          sed -i "s/^\(\s*newTag:\).*/\1 \"${IMAGE_VERSION}\"/" frontend/kustomization.yaml
          git diff --exit-code && { echo "Тег не изменился"; exit 0; }

          git config user.name  "ci-bot"
          git config user.email "ci-bot@local"
          git commit -am "frontend: ${IMAGE_VERSION}"

          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1