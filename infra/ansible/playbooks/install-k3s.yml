---
- name: Install server
  hosts: control
  become: true

  tasks:
    - shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        timeout: 300

    - slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token


- name: Install workers
  hosts: workers
  become: true

  tasks:
    - shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL=https://{{ hostvars[groups['control'][0]].ansible_host }}:6443 \
        K3S_TOKEN="{{ hostvars[groups['control'][0]].node_token.content | b64decode | trim }}" \
        sh -
      args:
        creates: /usr/local/bin/k3s-agent
