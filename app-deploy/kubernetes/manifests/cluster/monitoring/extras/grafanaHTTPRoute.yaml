---
# group/kind/weight are the API server's defaults, written out explicitly:
# otherwise Argo CD sees the defaulted list items as a diff and self-heals forever
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      namespace: envoy
      sectionName: http

    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      namespace: envoy
      sectionName: https

  hostnames:
    - app.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana

      backendRefs:
        - group: ""
          kind: Service
          name: monitoring-grafana
          port: 80
          weight: 1
