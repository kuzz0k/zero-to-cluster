---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy
      namespace: envoy
      sectionName: http

    - name: envoy
      namespace: envoy
      sectionName: https

  hostnames:
    - app.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana

      backendRefs:
        - name: monitoring-grafana
          port: 80
