controller:
  type: daemonset

alloy:
  mounts:
    varlog: true

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

  configMap:
    content: |
      // Each Alloy pod only tails pods on its own node (HOSTNAME = spec.nodeName)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "app"
        }
        // /var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // containerd writes logs in CRI format: "<time> <stream> <flags> <message>"
      loki.process "pods" {
        stage.cri {}

        // successful probes and Prometheus scrapes, every 10-30s from every pod
        stage.drop {
          expression          = "\"GET /(health|healthz|ready|metrics)[^ ]* HTTP/[0-9.]+\" 200"
          drop_counter_reason = "probes_and_scrapes"
        }

        // Alertmanager prints the full Telegram URL on errors: /bot<id>:<token>/sendMessage
        stage.replace {
          expression = "bot[0-9]+:([A-Za-z0-9_-]+)"
          replace    = "<redacted>"
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

serviceMonitor:
  enabled: true
