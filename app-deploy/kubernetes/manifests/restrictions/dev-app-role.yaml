---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-app-role
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/portforward
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - deployments
      - statefulsets
      - replicasets
      - jobs
      - cronjobs
      - ingresses
    verbs: [get, list, watch, create, update, patch, delete]

  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]

  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch]

  - apiGroups: [""]
    resources: [limitranges, resourcequotas]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-psql-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - events
    verbs: [get, list, watch]

  - apiGroups: ["apps"]
    resources: [statefulsets, replicasets]
    verbs: [get, list, watch]

  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-app-binding
  namespace: app
subjects:
  - kind: User
    name: ubuntu
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: dev-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-psql-binding
  namespace: psql
subjects:
  - kind: User
    name: ubuntu
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: dev-psql-role
  apiGroup: rbac.authorization.k8s.io