apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-budget
  namespace: app
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"

    pods: "8"
    services: "4"
    configmaps: "4"
    secrets: "4"
    persistentvolumeclaims: "2"

    count/deployments.apps: "4"
    count/statefulsets.apps: "2"
    count/jobs.batch: "5"
    count/cronjobs.batch: "2"

    requests.storage: "50Gi"