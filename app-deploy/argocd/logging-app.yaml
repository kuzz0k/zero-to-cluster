---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/logging/loki-values.yaml

    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.3
      helm:
        releaseName: alloy
        valueFiles:
          - $values/logging/alloy-values.yaml

    - repoURL: http://192.168.1.205:3000/user1/cluster-platform-repo.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
